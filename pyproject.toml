[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suno_downloaderist"]

[project]
name = "suno-song-downloaderist"
version = "0.1.0"
description = "Download, organize, and preserve your entire Suno AI music library"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "chchchadzilla"}]
dependencies = [
    "httpx>=0.27.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "playwright>=1.40.0",
    "mutagen>=1.47.0",
    "cryptography>=41.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "httpx[http2]"
]

[project.urls]
Homepage = "https://github.com/chchchadzilla/suno-song-downloaderist"
Repository = "https://github.com/chchchadzilla/suno-song-downloaderist"
Issues = "https://github.com/chchchadzilla/suno-song-downloaderist/issues"

[project.scripts]
suno-dl = "suno_downloaderist.cli:cli"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "S", "B", "A", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
